name: Publicar wiki / Publish wiki

on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material "mkdocs-static-i18n>=1.0"
      - run: mkdocs gh-deploy --force
        working-directory: wiki
